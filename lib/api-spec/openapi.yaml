  /admin/advertising/revenue:
    get:
      operationId: getAdminAdvertisingRevenue
      tags: [admin, advertising, billing]
      responses:
        "200":
          description: Provider-backed advertising revenue summary
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingRevenueSummary" } } }
        "503": { description: Approved billing provider is not connected }
  /advertising/billing/webhook:
    post:
      operationId: receiveAdvertisingBillingWebhook
      tags: [advertising, billing]
      description: Provider webhook endpoint. Requests must include a provider signature; card data is never accepted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingBillingWebhookEvent" } } }
      responses:
        "200": { description: Event accepted or already processed }
        "400": { description: Invalid or missing provider signature }
        "503": { description: Billing provider is not configured }
  /advertising/placement:
    get:
      operationId: getAdPlacement
      tags: [advertising]
      parameters:
        - { name: placement, in: query, required: true, schema: { type: string, enum: [home_feed, following_feed, search, trending, profile, clips, right_rail] } }
        - { name: sessionId, in: query, required: true, schema: { type: string, minLength: 12, maxLength: 200 } }
        - { name: language, in: query, schema: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' } }
        - { name: device, in: query, schema: { type: string, enum: [mobile, tablet, desktop] } }
        - { name: geography, in: query, schema: { type: string, maxLength: 80 } }
        - { name: interests, in: query, schema: { type: string, maxLength: 1000, description: Comma-separated viewer interest slugs. } }
        - { name: categories, in: query, schema: { type: string, maxLength: 1000, description: Comma-separated content category slugs. } }
        - { name: keywords, in: query, schema: { type: string, maxLength: 1000, description: Comma-separated contextual keywords. } }
      responses: { "200": { description: Eligible advertisement, content: { application/json: { schema: { type: object, required: [ad], properties: { ad: { anyOf: [{ $ref: "#/components/schemas/AdvertisementDelivery" }, { type: "null" }] } } } } } } }
  /advertising/events:
    post:
      operationId: recordAdEvent
      tags: [advertising]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdEventInput" } } } }
      responses: { "201": { description: Event recorded, content: { application/json: { schema: { type: object, required: [recorded], properties: { recorded: { type: boolean } } } } } } }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: number
        minimum: 1
        default: 1
    FeedTab:
      name: tab
      in: query
      schema:
        type: string
        enum: [for-you, following, trending, nearby]
        default: for-you
    Latitude:
      name: latitude
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
    Longitude:
      name: longitude
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
    Radius:
      name: radius
      in: query
      schema:
        type: number
        minimum: 1
        maximum: 100
        default: 20
    BlastId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ClipId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TargetSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema: { type: number, minimum: 1, maximum: 100, default: 25 }
    Status:
      name: status
      in: query
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
    AdvertisingId:
      name: id
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ViewerLocale:
      type: object
      required: [language, direction]
      properties:
        language:
          type: string
          enum: [en, fr, es, de, pt, it, nl, tr, ru, ar, zh, ja, ko]
        direction:
          type: string
          enum: [ltr, rtl]
    TranslationInput:
      type: object
      additionalProperties: false
      required: [text, targetLanguage]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        targetLanguage:
          type: string
          enum: [en, fr, es, de, pt, it, nl, tr, ru, ar, zh, ja, ko]
        context:
          type: string
          enum: [blast, comment, bio, notification]
    TranslationResult:
      type: object
      required: [originalText, translatedText, detectedLanguage, targetLanguage, translated]
      properties:
        originalText: { type: string }
        translatedText: { type: string }
        detectedLanguage:
          type: string
          enum: [en, fr, es, de, pt, it, nl, tr, ru, ar, zh, ja, ko, und]
        targetLanguage:
          type: string
          enum: [en, fr, es, de, pt, it, nl, tr, ru, ar, zh, ja, ko]
        translated: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    User:
      type: object
      required: [id, username, displayName, avatarUrl, bio, location, city, state, followers, following, blastCount, joinedAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        bio: { type: string }
        location: { type: string }
        city: { type: string }
        state: { type: string }
        coverUrl: { type: string }
        followers: { type: number }
        following: { type: number }
        blastCount: { type: number }
        joinedAt: { type: string }
        isFollowing: { type: boolean }
    CurrentUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            zipCode: { type: string }
            onboardingComplete: { type: boolean }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        username: { type: string, pattern: "^[a-zA-Z0-9_]{3,30}$" }
        bio: { type: string, maxLength: 280 }
        location: { type: string, maxLength: 120 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 50 }
        zipCode: { type: string, pattern: "^(?:[0-9]{5}(?:-[0-9]{4})?)?$" }
        avatarUrl: { type: string, maxLength: 500 }
        coverUrl: { type: string, maxLength: 500 }
        onboardingComplete: { type: boolean }
    Profile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [blasts, media]
          properties:
            coverUrl: { type: string }
            blasts:
              type: array
              items: { $ref: "#/components/schemas/Blast" }
            media:
              type: array
              items: { $ref: "#/components/schemas/Blast" }
    Target:
      type: object
      required: [id, name, slug, type, location, blastCount, imageUrl, bannerImageUrl, description]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        type:
          type: string
          enum: [person, business, place, product, entertainment, sports, gaming, other]
        location: { type: string }
        blastCount: { type: number }
        imageUrl: { type: string }
        bannerImageUrl: { type: string }
        description: { type: string }
        isCanonical: { type: boolean }
        isPreloaded: { type: boolean }
        preloadCategory: { type: [string, "null"] }
        preloadStatus: { type: string, enum: [active, disabled, archived] }
        featured: { type: boolean }
        verified: { type: boolean }
        aliases: { type: array, items: { type: string } }
        matchKind:
          type: string
          enum: [exact, alias, likely, same-name-different-location]
        matchScore: { type: number, minimum: 0, maximum: 1 }
        matchReason: { type: string }
    TargetInput:
      type: object
      required: [name, type, location, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type:
          type: string
          enum: [person, business, place, product, entertainment, sports, gaming, other]
        location: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        imageUrl: { type: string, maxLength: 500 }
        bannerImageUrl: { type: string, maxLength: 500 }
        confirmDistinct:
          type: boolean
          default: false
          description: Confirm that ambiguous candidates represent a different entity; definitive duplicates remain blocked.
    TargetConflict:
      type: object
      required: [error, message, canCreateNew, candidates]
      properties:
        error:
          type: string
          enum: [target_resolution_required]
        message: { type: string }
        canCreateNew: { type: boolean }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Target" }
    PreloadedTargetInput:
      type: object
      required: [name, slug, type, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        type: { type: string, enum: [person, business, place, product, entertainment, sports, gaming, other] }
        category: { type: string, minLength: 1, maxLength: 60 }
        aliases: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 120 } }
        description: { type: string, maxLength: 500 }
        imageUrl: { type: string, maxLength: 500 }
        bannerImageUrl: { type: string, maxLength: 500 }
        featured: { type: boolean }
        verified: { type: boolean }
        status: { type: string, enum: [active, disabled] }
    PreloadedTargetUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        type: { type: string, enum: [person, business, place, product, entertainment, sports, gaming, other] }
        category: { type: string, minLength: 1, maxLength: 60 }
        aliases: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 120 } }
        description: { type: string, maxLength: 500 }
        imageUrl: { type: string, maxLength: 500 }
        bannerImageUrl: { type: string, maxLength: 500 }
        featured: { type: boolean }
        verified: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        archive: { type: boolean }
    PreloadedTargetEnrichmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
    PreloadedTargetEnrichment:
      type: object
      required: [name, slug, type, category, aliases, description, imageUrl, bannerImageUrl, sourcePageUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        type: { type: string, enum: [person, business, place, product, entertainment, sports, gaming, other] }
        category: { type: string, minLength: 1, maxLength: 60 }
        aliases: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 120 } }
        description: { type: string, maxLength: 500 }
        imageUrl: { type: string, maxLength: 500 }
        bannerImageUrl: { type: string, maxLength: 500 }
        sourcePageUrl: { type: string, maxLength: 500 }
    PreloadedTargetPage:
      type: object
      required: [items, page, limit, total, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Target" } }
        page: { type: number }
        limit: { type: number }
        total: { type: number }
        hasMore: { type: boolean }
    PreloadedTargetMetrics:
      type: object
      required: [targetId, blastCount, commentCount, reactionCount, viewCount, shareCount]
      properties:
        targetId: { type: string }
        blastCount: { type: number }
        commentCount: { type: number }
        reactionCount: { type: number }
        viewCount: { type: number }
        shareCount: { type: number }
    PreloadedCsvImport:
      type: object
      required: [csv]
      properties:
        csv: { type: string, minLength: 1, maxLength: 1000000 }
    PreloadedImportPreview:
      type: object
      required: [total, createCount, existingCount, duplicateCount, invalidCount, rows]
      properties:
        total: { type: number }
        createCount: { type: number }
        existingCount: { type: number }
        duplicateCount: { type: number }
        invalidCount: { type: number }
        rows: { type: array, items: { type: object, required: [line, status], properties: { line: { type: number }, status: { type: string, enum: [create, existing, duplicate, invalid] }, message: { type: string } } } }
    Blast:
      type: object
      required: [id, content, createdAt, author, target, location, mediaUrl, reactions, commentCount, shareCount, viewCount, isBookmarked]
      properties:
        id: { type: string }
        content: { type: string }
        createdAt: { type: string }
        author: { $ref: "#/components/schemas/User" }
        target: { $ref: "#/components/schemas/Target" }
        location: { type: string }
        mediaUrl: { type: string }
        mediaType:
          type: [string, "null"]
          enum: [image, video, null]
        reactions: { $ref: "#/components/schemas/ReactionSummary" }
        commentCount: { type: number }
        shareCount: { type: number }
        viewCount: { type: number }
        isBookmarked: { type: boolean }
        isBlastBack: { type: boolean }
        originalBlastId:
          type: [string, "null"]
    FeedResponse:
      type: object
      required: [items, page, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Blast" }
        page: { type: number }
        hasMore: { type: boolean }
        radiusMiles: { type: number }
        locationRequired: { type: boolean }
    TrendingResponse:
      type: object
      required: [blasts, targets]
      properties:
        blasts:
          type: array
          items: { $ref: "#/components/schemas/Blast" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/Target" }
    TargetDetail:
      type: object
      required: [target, blasts, stats]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        blasts:
          type: array
          items: { $ref: "#/components/schemas/Blast" }
        stats: { $ref: "#/components/schemas/TargetStats" }
    TargetStats:
      type: object
      required: [positiveReactions, negativeReactions, engagement, activity]
      properties:
        positiveReactions: { type: number }
        negativeReactions: { type: number }
        engagement: { type: number }
        activity: { type: number }
    SearchResults:
      type: object
      required: [people, blasts, targets]
      properties:
        people:
          type: array
          items: { $ref: "#/components/schemas/User" }
        blasts:
          type: array
          items: { $ref: "#/components/schemas/Blast" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/Target" }
    BlastInput:
      type: object
      required: [content, targetId]
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
        targetId: { type: string }
        location: { type: string }
        mediaUrl: { type: string }
        mediaType:
          type: string
          enum: [image, video]
    BlastUpdate:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
        location: { type: string }
    ReactionInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [blast, facts, cap, funny, watching]
    ReactionSummary:
      type: object
      required: [blast, facts, cap, funny, watching, currentUserReaction]
      properties:
        blast: { type: number }
        facts: { type: number }
        cap: { type: number }
        funny: { type: number }
        watching: { type: number }
        currentUserReaction:
          type: [string, "null"]
          enum: [blast, facts, cap, funny, watching, null]
    CommentInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
        parentCommentId: { type: string }
    Comment:
