      required: [id, appellantId, targetType, targetId, reason, details, status, reviewerClerkId, reviewerNote, createdAt, updatedAt]
      properties:
        id: { type: string }
        appellantId: { type: string }
        targetType: { type: string, enum: [user, blast, comment, target] }
        targetId: { type: string }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [open, in_review, approved, rejected] }
        reviewerClerkId: { type: [string, "null"] }
        reviewerNote: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    AppealInput:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { type: string, enum: [user, blast, comment, target] }
        targetId: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 160 }
        details: { type: string, maxLength: 2000 }
    AppealReview:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [in_review, approved, rejected] }
        note: { type: string, maxLength: 1000 }
    AppealPage:
      type: object
      required: [items, page, limit, total, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Appeal" } }
        page: { type: number }
        limit: { type: number }
        total: { type: number }
        hasMore: { type: boolean }
    BlockedWord:
      type: object
      required: [id, term, action, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        term: { type: string }
        action: { type: string, enum: [block, flag] }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string }
        updatedAt: { type: string }
    BlockedWordInput:
      type: object
      required: [term, action]
      properties:
        term: { type: string, minLength: 1, maxLength: 120 }
        action: { type: string, enum: [block, flag] }
    BlockedWordUpdate:
      type: object
      properties:
        term: { type: string, minLength: 1, maxLength: 120 }
        action: { type: string, enum: [block, flag] }
        status: { type: string, enum: [active, disabled] }
    BlockedWordList:
      type: array
      items: { $ref: "#/components/schemas/BlockedWord" }
    AdminNotification:
      type: object
      required: [id, category, title, message, entityType, entityId, read, createdAt]
      properties:
        id: { type: string }
        category: { type: string }
        title: { type: string }
        message: { type: string }
        entityType: { type: [string, "null"] }
        entityId: { type: [string, "null"] }
        read: { type: boolean }
        createdAt: { type: string }
    AdminNotificationPage:
      type: object
      required: [items, unreadCount]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminNotification" } }
        unreadCount: { type: number }
    BoostRequest:
      type: object
      required: [id, blastId, requesterId, status, budget, placement, startsAt, endsAt, requestNote, reviewerClerkId, reviewNote, createdAt, updatedAt]
      properties:
        id: { type: string }
        blastId: { type: string }
        requesterId: { type: string }
        status: { type: string, enum: [pending_review, approved, paused, rejected] }
        budget: { type: [number, "null"] }
        placement: { type: string, enum: [home_feed, following_feed, search, trending, profile, clips, right_rail] }
        startsAt: { type: [string, "null"] }
        endsAt: { type: [string, "null"] }
        requestNote: { type: string }
        reviewerClerkId: { type: [string, "null"] }
        reviewNote: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    BoostRequestInput:
      type: object
      required: [blastId, placement]
      properties:
        blastId: { type: string }
        budget: { type: number, minimum: 0 }
        placement: { type: string, enum: [home_feed, following_feed, search, trending, profile, clips, right_rail] }
        startsAt: { type: string }
        endsAt: { type: string }
        requestNote: { type: string, maxLength: 1000 }
    BoostReview:
      type: object
      required: [status, note]
      properties:
        status: { type: string, enum: [approved, paused, rejected] }
        note: { type: string, minLength: 1, maxLength: 1000 }
    BoostRequestPage:
      type: object
      required: [items, page, limit, total, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BoostRequest" } }
        page: { type: number }
        limit: { type: number }
        total: { type: number }
        hasMore: { type: boolean }
