openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BLASTERR social platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: feed
  - name: blasts
  - name: targets
  - name: people
  - name: discovery
  - name: notifications
  - name: announcements
  - name: admin
  - name: advertising
  - name: localization
paths:
  /localization/locale:
    get:
      operationId: getViewerLocale
      tags: [localization]
      summary: Detect the viewer language without storing personal location data
      responses:
        "200":
          description: Supported viewer locale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerLocale"
  /localization/translate:
    post:
      operationId: translateText
      tags: [localization]
      summary: Translate user text without changing its stored original
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationInput"
      responses:
        "200":
          description: Translation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationResult"
        "400": { description: Invalid translation request }
        "429": { description: Translation rate limit exceeded }
        "502": { description: Translation provider unavailable }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: Get published announcements for the current viewer
      responses:
        "200":
          description: Published announcements visible to the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementsResponse"
        "401":
          description: Authentication session could not be verified
  /me:
    get:
      operationId: getCurrentUser
      tags: [people]
      summary: Get the current signed-in profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
    patch:
      operationId: updateCurrentUser
      tags: [people]
      summary: Update the current signed-in profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get a ranked feed of Blasts
      parameters:
        - $ref: "#/components/parameters/FeedTab"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Radius"
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
  /trending:
    get:
      operationId: getTrending
      tags: [feed]
      summary: Get trending Blasts and Targets
      responses:
        "200":
          description: Trending content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"
  /search:
    get:
      operationId: search
      tags: [discovery]
      summary: Search people, Blasts, and Targets
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          schema:
            type: string
            enum: [all, people, blasts, targets]
            default: all
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: List or search Targets
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [person, business, place, product, entertainment, sports, gaming, other]
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
    post:
      operationId: createTarget
      tags: [targets]
      summary: Create a new Target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "201":
          description: Created Target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "409":
          description: Target resolution required before creating a possible duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetConflict"
  /targets/{slug}:
    get:
      operationId: getTarget
      tags: [targets]
      summary: Get a Target and its Blasts
      parameters:
        - $ref: "#/components/parameters/TargetSlug"
      responses:
        "200":
          description: Target detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetDetail"
        "404":
          description: Target not found
  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [people]
      summary: Get a user profile
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: User not found
  /users/{username}/follow:
    post:
      operationId: toggleFollow
      tags: [people]
      summary: Follow or unfollow a user
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: Updated follow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
  /blasts:
    post:
      operationId: createBlast
      tags: [blasts]
      summary: Publish a new Blast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastInput"
      responses:
        "201":
          description: Published Blast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blast"
  /blasts/{id}:
    patch:
      operationId: updateBlast
      tags: [blasts]
      summary: Edit an owned Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastUpdate"
      responses:
        "200":
          description: Updated Blast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blast"
    delete:
      operationId: deleteBlast
      tags: [blasts]
      summary: Delete an owned Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      responses:
        "204":
          description: Deleted
  /clips:
    get:
      operationId: getMyClips
      tags: [clips]
      summary: Get the current user's BLASTR Clips
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, DRAFT, QUEUED, PROCESSING, COMPLETED, FAILED, SHARED]
            default: all
      responses:
        "200":
          description: Clip library
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Clip" }
    post:
      operationId: createClip
      tags: [clips]
      summary: Create a BLASTR Clip render job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipInput"
      responses:
        "201":
          description: Queued clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "403":
          description: Clip creation is not permitted
  /clips/{id}:
    get:
      operationId: getClip
      tags: [clips]
      summary: Get a BLASTR Clip
      parameters:
        - $ref: "#/components/parameters/ClipId"
      responses:
        "200":
          description: Clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Clip not found
    patch:
      operationId: updateClip
      tags: [clips]
      summary: Update a draft or failed BLASTR Clip
      parameters:
        - $ref: "#/components/parameters/ClipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipUpdate"
      responses:
        "200":
          description: Updated clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
    delete:
      operationId: deleteClip
      tags: [clips]
      summary: Delete an owned BLASTR Clip
      parameters:
        - $ref: "#/components/parameters/ClipId"
      responses:
        "204":
          description: Deleted
  /clips/{id}/retry:
    post:
      operationId: retryClip
      tags: [clips]
      summary: Retry a failed BLASTR Clip render
      parameters:
        - $ref: "#/components/parameters/ClipId"
      responses:
        "200":
          description: Requeued clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
  /clips/{id}/share:
    post:
      operationId: shareClip
      tags: [clips]
      summary: Create a share link for a completed BLASTR Clip
      parameters:
        - $ref: "#/components/parameters/ClipId"
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
  /blasts/{id}/reactions:
    post:
      operationId: reactToBlast
      tags: [blasts]
      summary: Set or remove a reaction
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Updated reactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
  /blasts/{id}/comments:
    post:
      operationId: createComment
      tags: [blasts]
      summary: Comment on a Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: New comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /blasts/{id}/back:
    post:
      operationId: createBlastBack
      tags: [blasts]
      summary: Respond to a Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastInput"
      responses:
        "201":
          description: Blast Back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blast"
  /blasts/{id}/bookmark:
    post:
      operationId: toggleBookmark
      tags: [blasts]
      summary: Save or unsave a Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      responses:
        "200":
          description: Updated bookmark state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkState"
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /bookmarks:
    get:
      operationId: getBookmarks
      tags: [blasts]
      summary: Get saved Blasts
      responses:
        "200":
          description: Saved Blasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Blast"
  /reports:
    post:
      operationId: createReport
      tags: [blasts]
      summary: Report content or a user
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          description: Authentication required
  /blocks:
    post:
      operationId: toggleBlock
      tags: [people]
      summary: Block or unblock a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "200":
          description: Updated block state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockState"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get admin command center metrics
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/preloaded-targets:
    get:
      operationId: listAdminPreloadedTargets
      tags: [admin]
      summary: List curated canonical Targets
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [all, active, disabled, archived], default: all } }
      responses:
        "200": { description: Curated targets, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedTargetPage" } } } }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
    post:
      operationId: createAdminPreloadedTarget
      tags: [admin]
      summary: Create a canonical curated Target
      security: [{ clerkSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedTargetInput" } } } }
      responses:
        "201": { description: Created curated Target, content: { application/json: { schema: { $ref: "#/components/schemas/Target" } } } }
        "409": { description: Canonical subject already exists }
  /admin/preloaded-targets/enrich:
    post:
      operationId: enrichAdminPreloadedTarget
      tags: [admin]
      summary: Propose curated Target fields and import a current Wikimedia profile image
      security: [{ clerkSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedTargetEnrichmentInput" } } } }
      responses:
        "200": { description: Review-only enrichment proposal, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedTargetEnrichment" } } } }
        "404": { description: No reliable public profile found }
  /admin/preloaded-targets/{id}:
    patch:
      operationId: updateAdminPreloadedTarget
      tags: [admin]
      summary: Edit, disable, archive, feature, or verify a curated Target
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedTargetUpdate" } } } }
      responses:
        "200": { description: Updated curated Target, content: { application/json: { schema: { $ref: "#/components/schemas/Target" } } } }
        "404": { description: Curated Target not found }
  /admin/preloaded-targets/{id}/metrics:
    get:
      operationId: getAdminPreloadedTargetMetrics
      tags: [admin]
      summary: Get real linked Target activity metrics
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200": { description: Target metrics, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedTargetMetrics" } } } }
        "404": { description: Curated Target not found }
  /admin/preloaded-targets/{id}/adopt:
    post:
      operationId: adoptAdminPreloadedTarget
      tags: [admin]
      summary: Designate an existing Target as a canonical curated subject
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedTargetInput" } } } }
      responses:
        "200": { description: Adopted Target, content: { application/json: { schema: { $ref: "#/components/schemas/Target" } } } }
        "404": { description: Target not found }
        "409": { description: Colliding or already-canonical subject; review returned conflicts }
  /admin/preloaded-targets/import/preview:
    post:
      operationId: previewAdminPreloadedImport
      tags: [admin]
      summary: Validate CSV text without writing records
      security: [{ clerkSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedCsvImport" } } } }
      responses:
        "200": { description: Import preview, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedImportPreview" } } } }
  /admin/preloaded-targets/import:
    post:
      operationId: confirmAdminPreloadedImport
      tags: [admin]
      summary: Create validated missing curated Targets from CSV
      security: [{ clerkSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedCsvImport" } } } }
      responses:
        "201": { description: Import completed, content: { application/json: { schema: { $ref: "#/components/schemas/PreloadedImportPreview" } } } }
  /admin/clips:
    get:
      operationId: getAdminClips
      tags: [admin, clips]
      summary: Get the protected BLASTR Media Center overview
      responses:
        "200":
          description: Media Center overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClipsOverview"
        "403":
          description: Admin access required
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List users for moderation
      security: [{ clerkSession: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, suspended] }
      responses:
        "200":
          description: Admin users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsersResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user's moderation status or role
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: User not found }
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a user
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: User deleted }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: User not found }
  /admin/content:
    get:
      operationId: getAdminContent
      tags: [admin]
      summary: List Blasts for moderation
      security: [{ clerkSession: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [all, published, hidden, removed] }
      responses:
        "200":
          description: Moderation content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/content/{id}:
    patch:
      operationId: updateAdminContent
      tags: [admin]
      summary: Update a Blast moderation status
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminContentUpdate" }
      responses:
        "200":
          description: Updated Blast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentItem" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Blast not found }
    delete:
      operationId: deleteAdminContent
      tags: [admin]
      summary: Remove a Blast
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/BlastId"
      responses:
        "204": { description: Blast removed }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Blast not found }
  /admin/reports:
    get:
      operationId: getAdminReports
      tags: [admin]
      summary: List community reports
      security: [{ clerkSession: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, open, in_review, resolved, dismissed] }
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportsResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/reports/{id}:
    patch:
      operationId: updateAdminReport
      tags: [admin]
      summary: Resolve or triage a community report
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReportUpdate" }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReport" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Report not found }
  /admin/moderation:
    get:
      operationId: getAdminModeration
      tags: [admin]
      summary: Get the moderation queue
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModerationResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
    post:
      operationId: createAdminModerationAction
      tags: [admin]
      summary: Take a moderation action
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModerationAction" }
      responses:
        "200":
          description: Moderation action recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActionResult" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Report not found }
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get platform analytics
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalytics" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/system:
    get:
      operationId: getAdminSystem
      tags: [admin]
      summary: Get protected system health details
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: System health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSystem" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: List moderation audit events
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditResponse" }
