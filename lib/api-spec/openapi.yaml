openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BLASTERR social platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: feed
  - name: blasts
  - name: targets
  - name: people
  - name: discovery
  - name: notifications
  - name: announcements
  - name: admin
  - name: advertising
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: Get published announcements for the current viewer
      responses:
        "200":
          description: Published announcements visible to the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementsResponse"
        "401":
          description: Authentication session could not be verified
  /me:
    get:
      operationId: getCurrentUser
      tags: [people]
      summary: Get the current signed-in profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
    patch:
      operationId: updateCurrentUser
      tags: [people]
      summary: Update the current signed-in profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get a ranked feed of Blasts
      parameters:
        - $ref: "#/components/parameters/FeedTab"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Radius"
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
  /trending:
    get:
      operationId: getTrending
      tags: [feed]
      summary: Get trending Blasts and Targets
      responses:
        "200":
          description: Trending content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"
  /search:
    get:
      operationId: search
      tags: [discovery]
      summary: Search people, Blasts, and Targets
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          schema:
            type: string
            enum: [all, people, blasts, targets]
            default: all
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: List or search Targets
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [person, business, place, product, entertainment, sports, gaming, other]
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
    post:
      operationId: createTarget
      tags: [targets]
      summary: Create a new Target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "201":
          description: Created Target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "409":
          description: Target resolution required before creating a possible duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetConflict"
  /targets/{slug}:
    get:
      operationId: getTarget
      tags: [targets]
      summary: Get a Target and its Blasts
      parameters:
        - $ref: "#/components/parameters/TargetSlug"
      responses:
        "200":
          description: Target detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetDetail"
        "404":
          description: Target not found
  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [people]
      summary: Get a user profile
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: User not found
  /users/{username}/follow:
    post:
      operationId: toggleFollow
      tags: [people]
      summary: Follow or unfollow a user
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: Updated follow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
  /blasts:
    post:
      operationId: createBlast
      tags: [blasts]
      summary: Publish a new Blast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastInput"
      responses:
        "201":
          description: Published Blast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blast"
  /blasts/{id}:
    patch:
      operationId: updateBlast
      tags: [blasts]
      summary: Edit an owned Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastUpdate"
      responses:
        "200":
          description: Updated Blast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blast"
    delete:
      operationId: deleteBlast
      tags: [blasts]
      summary: Delete an owned Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      responses:
        "204":
          description: Deleted
  /clips:
    get:
      operationId: getMyClips
      tags: [clips]
      summary: Get the current user's BLASTR Clips
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, DRAFT, QUEUED, PROCESSING, COMPLETED, FAILED, SHARED]
            default: all
      responses:
        "200":
          description: Clip library
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Clip" }
    post:
      operationId: createClip
      tags: [clips]
      summary: Create a BLASTR Clip render job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipInput"
      responses:
        "201":
          description: Queued clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "403":
          description: Clip creation is not permitted
  /clips/{id}:
    get:
      operationId: getClip
      tags: [clips]
      summary: Get a BLASTR Clip
      parameters:
        - $ref: "#/components/parameters/ClipId"
      responses:
        "200":
          description: Clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Clip not found
    patch:
      operationId: updateClip
      tags: [clips]
      summary: Update a draft or failed BLASTR Clip
      parameters:
        - $ref: "#/components/parameters/ClipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipUpdate"
      responses:
        "200":
          description: Updated clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
    delete:
      operationId: deleteClip
      tags: [clips]
      summary: Delete an owned BLASTR Clip
      parameters:
        - $ref: "#/components/parameters/ClipId"
      responses:
        "204":
          description: Deleted
  /clips/{id}/retry:
    post:
      operationId: retryClip
      tags: [clips]
      summary: Retry a failed BLASTR Clip render
      parameters:
        - $ref: "#/components/parameters/ClipId"
      responses:
        "200":
          description: Requeued clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
  /clips/{id}/share:
    post:
      operationId: shareClip
      tags: [clips]
      summary: Create a share link for a completed BLASTR Clip
      parameters:
        - $ref: "#/components/parameters/ClipId"
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
  /blasts/{id}/reactions:
    post:
      operationId: reactToBlast
      tags: [blasts]
      summary: Set or remove a reaction
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Updated reactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
  /blasts/{id}/comments:
    post:
      operationId: createComment
      tags: [blasts]
      summary: Comment on a Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: New comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /blasts/{id}/back:
    post:
      operationId: createBlastBack
      tags: [blasts]
      summary: Respond to a Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastInput"
      responses:
        "201":
          description: Blast Back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blast"
  /blasts/{id}/bookmark:
    post:
      operationId: toggleBookmark
      tags: [blasts]
      summary: Save or unsave a Blast
      parameters:
        - $ref: "#/components/parameters/BlastId"
      responses:
        "200":
          description: Updated bookmark state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkState"
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /bookmarks:
    get:
      operationId: getBookmarks
      tags: [blasts]
      summary: Get saved Blasts
      responses:
        "200":
          description: Saved Blasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Blast"
  /reports:
    post:
      operationId: createReport
      tags: [blasts]
      summary: Report content or a user
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          description: Authentication required
  /blocks:
    post:
      operationId: toggleBlock
      tags: [people]
      summary: Block or unblock a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "200":
          description: Updated block state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockState"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get admin command center metrics
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/clips:
    get:
      operationId: getAdminClips
      tags: [admin, clips]
      summary: Get the protected BLASTR Media Center overview
      responses:
        "200":
          description: Media Center overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClipsOverview"
        "403":
          description: Admin access required
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List users for moderation
      security: [{ clerkSession: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, suspended] }
      responses:
        "200":
          description: Admin users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsersResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user's moderation status or role
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: User not found }
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a user
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: User deleted }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: User not found }
  /admin/content:
    get:
      operationId: getAdminContent
      tags: [admin]
      summary: List Blasts for moderation
      security: [{ clerkSession: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [all, published, hidden, removed] }
      responses:
        "200":
          description: Moderation content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/content/{id}:
    patch:
      operationId: updateAdminContent
      tags: [admin]
      summary: Update a Blast moderation status
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/BlastId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminContentUpdate" }
      responses:
        "200":
          description: Updated Blast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentItem" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Blast not found }
    delete:
      operationId: deleteAdminContent
      tags: [admin]
      summary: Remove a Blast
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/BlastId"
      responses:
        "204": { description: Blast removed }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Blast not found }
  /admin/reports:
    get:
      operationId: getAdminReports
      tags: [admin]
      summary: List community reports
      security: [{ clerkSession: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, open, in_review, resolved, dismissed] }
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportsResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/reports/{id}:
    patch:
      operationId: updateAdminReport
      tags: [admin]
      summary: Resolve or triage a community report
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReportUpdate" }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReport" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Report not found }
  /admin/moderation:
    get:
      operationId: getAdminModeration
      tags: [admin]
      summary: Get the moderation queue
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModerationResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
    post:
      operationId: createAdminModerationAction
      tags: [admin]
      summary: Take a moderation action
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModerationAction" }
      responses:
        "200":
          description: Moderation action recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActionResult" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Report not found }
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get platform analytics
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalytics" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/system:
    get:
      operationId: getAdminSystem
      tags: [admin]
      summary: Get protected system health details
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: System health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSystem" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: List moderation audit events
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get moderation settings
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update moderation settings
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/announcements:
    get:
      operationId: getAdminAnnouncements
      tags: [admin]
      summary: List platform announcements
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnnouncementsResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
    post:
      operationId: createAdminAnnouncement
      tags: [admin]
      summary: Create an announcement
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAnnouncementInput" }
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnnouncement" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/announcements/{id}:
    patch:
      operationId: updateAdminAnnouncement
      tags: [admin]
      summary: Update an announcement
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAnnouncementUpdate" }
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnnouncement" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Announcement not found }
    delete:
      operationId: deleteAdminAnnouncement
      tags: [admin]
      summary: Delete an announcement
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Announcement deleted }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Announcement not found }
  /admin/features:
    get:
      operationId: getAdminFeatures
      tags: [admin]
      summary: List feature controls
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Feature controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeaturesResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
  /admin/features/{key}:
    patch:
      operationId: updateAdminFeature
      tags: [admin]
      summary: Toggle a feature control
      security: [{ clerkSession: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFeatureUpdate" }
      responses:
        "200":
          description: Updated feature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeatureFlag" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Feature not found }
  /admin/advertising/overview:
    get:
      operationId: getAdminAdvertisingOverview
      tags: [admin, advertising]
      responses: { "200": { description: Advertising overview, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingOverview" } } } } }
  /admin/advertising/advertisers:
    get:
      operationId: listAdminAdvertisers
      tags: [admin, advertising]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Status" }, { $ref: "#/components/parameters/Search" }]
      responses: { "200": { description: Advertisers, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertiserPage" } } } } }
    post:
      operationId: createAdminAdvertiser
      tags: [admin, advertising]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertiserInput" } } } }
      responses: { "201": { description: Created advertiser, content: { application/json: { schema: { $ref: "#/components/schemas/Advertiser" } } } } }
  /admin/advertising/advertisers/{id}/status:
    patch:
      operationId: updateAdminAdvertiserStatus
      tags: [admin, advertising]
      parameters: [{ $ref: "#/components/parameters/AdvertisingId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusUpdate" } } } }
      responses: { "200": { description: Updated advertiser, content: { application/json: { schema: { $ref: "#/components/schemas/Advertiser" } } } } }
  /admin/advertising/campaigns:
    get:
      operationId: listAdminCampaigns
      tags: [admin, advertising]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Status" }, { $ref: "#/components/parameters/Search" }]
      responses: { "200": { description: Campaigns, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignPage" } } } } }
    post:
      operationId: createAdminCampaign
      tags: [admin, advertising]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignInput" } } } }
      responses: { "201": { description: Created campaign, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } } }
  /admin/advertising/campaigns/{id}/status:
    patch:
      operationId: updateAdminCampaignStatus
      tags: [admin, advertising]
      parameters: [{ $ref: "#/components/parameters/AdvertisingId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusUpdate" } } } }
      responses: { "200": { description: Updated campaign, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } } }
  /admin/advertising/advertisements:
    get:
      operationId: listAdminAdvertisements
      tags: [admin, advertising]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Status" }, { $ref: "#/components/parameters/Search" }]
      responses: { "200": { description: Advertisements, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisementPage" } } } } }
    post:
      operationId: createAdminAdvertisement
      tags: [admin, advertising]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisementInput" } } } }
      responses: { "201": { description: Created advertisement, content: { application/json: { schema: { $ref: "#/components/schemas/Advertisement" } } } } }
  /admin/advertising/advertisements/{id}/review:
    post:
      operationId: reviewAdminAdvertisement
      tags: [admin, advertising]
      parameters: [{ $ref: "#/components/parameters/AdvertisingId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisementReview" } } } }
      responses: { "200": { description: Reviewed advertisement, content: { application/json: { schema: { $ref: "#/components/schemas/Advertisement" } } } } }
  /admin/advertising/settings:
    get:
      operationId: getAdminAdvertisingSettings
      tags: [admin, advertising]
      responses: { "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSettings" } } } } }
    patch:
      operationId: updateAdminAdvertisingSettings
      tags: [admin, advertising]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSettingsUpdate" } } } }
      responses: { "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSettings" } } } } }
  /admin/advertising/audit:
    get:
      operationId: listAdminAdvertisingAudit
      tags: [admin, advertising]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Audit history, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingAuditPage" } } } } }
  /admin/advertising/billing:
    get:
      operationId: getAdminAdvertisingBilling
      tags: [admin, advertising, billing]
      responses:
        "200":
          description: Provider-backed advertising billing summary
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingBillingSummary" } } }
        "503": { description: Approved billing provider is not connected }
  /admin/advertising/transactions:
    get:
      operationId: listAdminAdvertisingTransactions
      tags: [admin, advertising, billing]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Status" }]
      responses:
        "200":
          description: Provider-backed advertising transactions
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingTransactionPage" } } }
        "503": { description: Approved billing provider is not connected }
  /admin/advertising/revenue:
    get:
      operationId: getAdminAdvertisingRevenue
      tags: [admin, advertising, billing]
      responses:
        "200":
          description: Provider-backed advertising revenue summary
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingRevenueSummary" } } }
        "503": { description: Approved billing provider is not connected }
  /advertising/billing/webhook:
    post:
      operationId: receiveAdvertisingBillingWebhook
      tags: [advertising, billing]
      description: Provider webhook endpoint. Requests must include a provider signature; card data is never accepted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingBillingWebhookEvent" } } }
      responses:
        "200": { description: Event accepted or already processed }
        "400": { description: Invalid or missing provider signature }
        "503": { description: Billing provider is not configured }
  /advertising/placement:
    get:
      operationId: getAdPlacement
      tags: [advertising]
      parameters:
        - { name: placement, in: query, required: true, schema: { type: string, enum: [home_feed, following_feed, search, trending, profile, clips, right_rail] } }
        - { name: sessionId, in: query, required: true, schema: { type: string, minLength: 12, maxLength: 200 } }
      responses: { "200": { description: Eligible advertisement, content: { application/json: { schema: { type: object, required: [ad], properties: { ad: { anyOf: [{ $ref: "#/components/schemas/AdvertisementDelivery" }, { type: "null" }] } } } } } } }
  /advertising/events:
    post:
      operationId: recordAdEvent
      tags: [advertising]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdEventInput" } } } }
      responses: { "201": { description: Event recorded, content: { application/json: { schema: { type: object, required: [recorded], properties: { recorded: { type: boolean } } } } } } }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: number
        minimum: 1
        default: 1
    FeedTab:
      name: tab
      in: query
      schema:
        type: string
        enum: [for-you, following, trending, nearby]
        default: for-you
    Latitude:
      name: latitude
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
    Longitude:
      name: longitude
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
    Radius:
      name: radius
      in: query
      schema:
        type: number
        minimum: 1
        maximum: 100
        default: 20
    BlastId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ClipId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TargetSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema: { type: number, minimum: 1, maximum: 100, default: 25 }
    Status:
      name: status
      in: query
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
    AdvertisingId:
      name: id
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    User:
      type: object
      required: [id, username, displayName, avatarUrl, bio, location, city, state, followers, following, blastCount, joinedAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        bio: { type: string }
        location: { type: string }
        city: { type: string }
        state: { type: string }
        coverUrl: { type: string }
        followers: { type: number }
        following: { type: number }
        blastCount: { type: number }
        joinedAt: { type: string }
        isFollowing: { type: boolean }
    CurrentUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            zipCode: { type: string }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        username: { type: string, pattern: "^[a-zA-Z0-9_]{3,30}$" }
        bio: { type: string, maxLength: 280 }
        location: { type: string, maxLength: 120 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 50 }
        zipCode: { type: string, pattern: "^(?:[0-9]{5}(?:-[0-9]{4})?)?$" }
        avatarUrl: { type: string, maxLength: 500 }
        coverUrl: { type: string, maxLength: 500 }
    Profile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [blasts, media]
          properties:
            coverUrl: { type: string }
            blasts:
              type: array
              items: { $ref: "#/components/schemas/Blast" }
            media:
              type: array
              items: { $ref: "#/components/schemas/Blast" }
    Target:
      type: object
      required: [id, name, slug, type, location, blastCount, imageUrl, description]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        type:
          type: string
          enum: [person, business, place, product, entertainment, sports, gaming, other]
        location: { type: string }
        blastCount: { type: number }
        imageUrl: { type: string }
        description: { type: string }
        matchKind:
          type: string
          enum: [exact, alias, likely, same-name-different-location]
        matchScore: { type: number, minimum: 0, maximum: 1 }
        matchReason: { type: string }
    TargetInput:
      type: object
      required: [name, type, location, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type:
          type: string
          enum: [person, business, place, product, entertainment, sports, gaming, other]
        location: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        imageUrl: { type: string, maxLength: 500 }
        confirmDistinct:
          type: boolean
          default: false
          description: Confirm that ambiguous candidates represent a different entity; definitive duplicates remain blocked.
    TargetConflict:
      type: object
      required: [error, message, canCreateNew, candidates]
      properties:
        error:
          type: string
          enum: [target_resolution_required]
        message: { type: string }
        canCreateNew: { type: boolean }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Target" }
    Blast:
      type: object
      required: [id, content, createdAt, author, target, location, mediaUrl, reactions, commentCount, shareCount, viewCount, isBookmarked]
      properties:
        id: { type: string }
        content: { type: string }
        createdAt: { type: string }
        author: { $ref: "#/components/schemas/User" }
        target: { $ref: "#/components/schemas/Target" }
        location: { type: string }
        mediaUrl: { type: string }
        mediaType:
          type: [string, "null"]
          enum: [image, video, null]
        reactions: { $ref: "#/components/schemas/ReactionSummary" }
        commentCount: { type: number }
        shareCount: { type: number }
        viewCount: { type: number }
        isBookmarked: { type: boolean }
        isBlastBack: { type: boolean }
        originalBlastId:
          type: [string, "null"]
    FeedResponse:
      type: object
      required: [items, page, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Blast" }
        page: { type: number }
        hasMore: { type: boolean }
        radiusMiles: { type: number }
        locationRequired: { type: boolean }
    TrendingResponse:
      type: object
      required: [blasts, targets]
      properties:
        blasts:
          type: array
          items: { $ref: "#/components/schemas/Blast" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/Target" }
    TargetDetail:
      type: object
      required: [target, blasts, stats]
      properties:
        target: { $ref: "#/components/schemas/Target" }
        blasts:
          type: array
          items: { $ref: "#/components/schemas/Blast" }
        stats: { $ref: "#/components/schemas/TargetStats" }
    TargetStats:
      type: object
      required: [positiveReactions, negativeReactions, engagement, activity]
      properties:
        positiveReactions: { type: number }
        negativeReactions: { type: number }
        engagement: { type: number }
        activity: { type: number }
    SearchResults:
      type: object
      required: [people, blasts, targets]
      properties:
        people:
          type: array
          items: { $ref: "#/components/schemas/User" }
        blasts:
          type: array
          items: { $ref: "#/components/schemas/Blast" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/Target" }
    BlastInput:
      type: object
      required: [content, targetId]
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
        targetId: { type: string }
        location: { type: string }
        mediaUrl: { type: string }
        mediaType:
          type: string
          enum: [image, video]
    BlastUpdate:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
        location: { type: string }
    ReactionInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [blast, facts, cap, funny, watching]
    ReactionSummary:
      type: object
      required: [blast, facts, cap, funny, watching, currentUserReaction]
      properties:
        blast: { type: number }
        facts: { type: number }
        cap: { type: number }
        funny: { type: number }
        watching: { type: number }
        currentUserReaction:
          type: [string, "null"]
          enum: [blast, facts, cap, funny, watching, null]
    CommentInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
        parentCommentId: { type: string }
    Comment:
      type: object
      required: [id, content, createdAt, author, likes, replyCount]
      properties:
        id: { type: string }
        content: { type: string }
        createdAt: { type: string }
        author: { $ref: "#/components/schemas/User" }
        likes: { type: number }
        replyCount: { type: number }
    FollowState:
      type: object
      required: [isFollowing, followerCount]
      properties:
        isFollowing: { type: boolean }
        followerCount: { type: number }
    BookmarkState:
      type: object
      required: [isBookmarked]
      properties:
        isBookmarked: { type: boolean }
    Notification:
      type: object
      required: [id, type, message, createdAt, read, actor]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [follow, reaction, comment, reply, blast-back, mention, trending, target]
        message: { type: string }
        createdAt: { type: string }
        read: { type: boolean }
        actor: { $ref: "#/components/schemas/User" }
    ReportInput:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [blast, comment, user]
        targetId: { type: string }
        reason:
          type: string
          enum: [spam, harassment, threats, hate, nudity, violence, scam, personal-information, impersonation, other]
        description: { type: string, maxLength: 1000 }
    Report:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string }
    BlockInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    BlockState:
      type: object
      required: [isBlocked]
      properties:
        isBlocked: { type: boolean }
    AdminOverview:
      type: object
      required: [usersOnline, blastsToday, trendingCount, newUsers, engagement, chart]
      properties:
        usersOnline: { type: number }
        blastsToday: { type: number }
        trendingCount: { type: number }
        newUsers: { type: number }
        engagement: { type: number }
        chart:
          type: array
          items:
            type: object
            required: [label, users, blasts, engagement]
            properties:
              label: { type: string }
              users: { type: number }
              blasts: { type: number }
              engagement: { type: number }
    Clip:
      type: object
      required: [id, blastId, creatorId, style, title, description, duration, aspectRatio, renderStatus, videoUrl, thumbnailUrl, createdAt, updatedAt, blast, creator, settings]
      properties:
        id: { type: string }
        blastId: { type: string }
        creatorId: { type: string }
        style:
          type: string
          enum: [BREAKING, FUNNY, DRAMATIC, RECEIPTS, DEBATE, STORY]
        title: { type: string }
        description: { type: string }
        duration: { type: number }
        aspectRatio: { type: string, enum: ["9:16"] }
        renderStatus:
          type: string
          enum: [DRAFT, QUEUED, PROCESSING, COMPLETED, FAILED, SHARED]
        videoUrl:
          type: [string, "null"]
        thumbnailUrl:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
        createdAt: { type: string }
        updatedAt: { type: string }
        blast: { $ref: "#/components/schemas/Blast" }
        creator: { $ref: "#/components/schemas/User" }
        settings: { $ref: "#/components/schemas/ClipSettings" }
    ClipInput:
      type: object
      required: [blastId, style]
      properties:
        blastId: { type: string }
        style:
          type: string
          enum: [BREAKING, FUNNY, DRAMATIC, RECEIPTS, DEBATE, STORY]
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        captionStyle:
          type: string
          enum: [bold, minimal, breaking, meme, cinematic, story]
        captionPosition:
          type: string
          enum: [top, center, bottom]
        captionAnimation:
          type: string
          enum: [pop, slide, fade, word-by-word, highlight]
        background: { type: string, maxLength: 80 }
        duration:
          type: number
          enum: [15, 30, 45, 60]
        brandingStyle:
          type: string
          enum: [minimal, full]
        ctaText: { type: string, maxLength: 120 }
    ClipUpdate:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        captionStyle: { type: string }
        captionPosition: { type: string }
        captionAnimation: { type: string }
        background: { type: string }
        duration: { type: number, enum: [15, 30, 45, 60] }
        brandingStyle: { type: string }
        ctaText: { type: string, maxLength: 120 }
    ClipSettings:
      type: object
      required: [captionStyle, captionPosition, captionAnimation, background, brandingStyle, ctaText]
      properties:
        captionStyle: { type: string }
        captionPosition: { type: string }
        captionAnimation: { type: string }
        background: { type: string }
        brandingStyle: { type: string }
        ctaText: { type: string }
    ShareLink:
      type: object
      required: [url]
      properties:
        url: { type: string }
    AdminClipsOverview:
      type: object
      required: [clipCount, completedCount, failedCount, activeRenders, clips]
      properties:
        clipCount: { type: number }
        completedCount: { type: number }
        failedCount: { type: number }
        activeRenders: { type: number }
        clips:
          type: array
          items: { $ref: "#/components/schemas/Clip" }
    Advertiser:
      type: object
      required: [id, name, status, ownerClerkId, contactEmail, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        ownerClerkId: { type: [string, "null"] }
        contactEmail: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    AdvertiserInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        ownerClerkId: { type: string, maxLength: 200 }
        contactEmail: { type: string, maxLength: 320 }
    Campaign:
      type: object
      required: [id, advertiserId, name, status, placements, targeting, dailyBudget, totalBudget, startsAt, endsAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        advertiserId: { type: string }
        name: { type: string }
        status: { type: string }
        placements: { type: array, items: { type: string } }
        targeting: { type: object, additionalProperties: true }
        dailyBudget: { type: [number, "null"] }
        totalBudget: { type: [number, "null"] }
        startsAt: { type: [string, "null"] }
        endsAt: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    CampaignInput:
      type: object
      required: [advertiserId, name, placements]
      properties:
        advertiserId: { type: string }
        name: { type: string, minLength: 1, maxLength: 160 }
        placements: { type: array, minItems: 1, items: { type: string, enum: [home_feed, following_feed, search, trending, profile, clips, right_rail] } }
        targeting: { type: object, additionalProperties: true }
        dailyBudget: { type: number, minimum: 0 }
        totalBudget: { type: number, minimum: 0 }
        startsAt: { type: string }
        endsAt: { type: string }
        status: { type: string, enum: [draft, active, paused] }
    Advertisement:
      type: object
      required: [id, campaignId, adGroupId, creativeId, name, status, placement, headline, body, mediaUrl, destinationUrl, createdAt, updatedAt]
      properties:
        id: { type: string }
        campaignId: { type: string }
        adGroupId: { type: [string, "null"] }
        creativeId: { type: [string, "null"] }
        name: { type: string }
        status: { type: string }
        placement: { type: string }
        headline: { type: string }
        body: { type: string }
        mediaUrl: { type: [string, "null"] }
        destinationUrl: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    AdvertisementInput:
      type: object
      required: [campaignId, name, placement, headline]
      properties:
        campaignId: { type: string }
        adGroupId: { type: string }
        creativeId: { type: string }
        name: { type: string, minLength: 1, maxLength: 160 }
        placement: { type: string, enum: [home_feed, following_feed, search, trending, profile, clips, right_rail] }
        headline: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        mediaUrl: { type: string, maxLength: 2000, description: Absolute HTTP(S) URL; enforced by the API. }
        destinationUrl: { type: string, maxLength: 2000, description: Absolute HTTP(S) URL; enforced by the API. }
    AdvertisementReview:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject, pause, resume, request_changes] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    AdvertisementDelivery:
      type: object
      required: [id, advertiserId, advertiserName, campaignId, placement, headline, body, mediaUrl, destinationUrl, deliveryToken]
      properties:
        id: { type: string }
        advertiserId: { type: string }
        advertiserName: { type: string }
        campaignId: { type: string }
        placement: { type: string }
        headline: { type: string }
        body: { type: string }
        mediaUrl: { type: [string, "null"] }
        destinationUrl: { type: [string, "null"] }
        deliveryToken: { type: string }
    AdEventInput:
      type: object
      required: [advertisementId, eventType, placement, sessionId, deliveryToken]
      properties:
        advertisementId: { type: string }
        eventType: { type: string, enum: [impression, click, video_view] }
