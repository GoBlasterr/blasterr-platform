    Report:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string }
    BlockInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    BlockState:
      type: object
      required: [isBlocked]
      properties:
        isBlocked: { type: boolean }
    AdminOverview:
      type: object
      required: [usersOnline, blastsToday, trendingCount, newUsers, engagement, chart]
      properties:
        usersOnline: { type: number }
        blastsToday: { type: number }
        trendingCount: { type: number }
        newUsers: { type: number }
        engagement: { type: number }
        chart:
          type: array
          items:
            type: object
            required: [label, users, blasts, engagement]
            properties:
              label: { type: string }
              users: { type: number }
              blasts: { type: number }
              engagement: { type: number }
    Clip:
      type: object
      required: [id, blastId, creatorId, style, title, description, duration, aspectRatio, renderStatus, videoUrl, thumbnailUrl, createdAt, updatedAt, blast, creator, settings]
      properties:
        id: { type: string }
        blastId: { type: string }
        creatorId: { type: string }
        style:
          type: string
          enum: [BREAKING, FUNNY, DRAMATIC, RECEIPTS, DEBATE, STORY]
        title: { type: string }
        description: { type: string }
        duration: { type: number }
        aspectRatio: { type: string, enum: ["9:16"] }
        renderStatus:
          type: string
          enum: [DRAFT, QUEUED, PROCESSING, COMPLETED, FAILED, SHARED]
        videoUrl:
          type: [string, "null"]
        thumbnailUrl:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
        createdAt: { type: string }
        updatedAt: { type: string }
        blast: { $ref: "#/components/schemas/Blast" }
        creator: { $ref: "#/components/schemas/User" }
        settings: { $ref: "#/components/schemas/ClipSettings" }
    ClipInput:
      type: object
      required: [blastId, style]
      properties:
        blastId: { type: string }
        style:
          type: string
          enum: [BREAKING, FUNNY, DRAMATIC, RECEIPTS, DEBATE, STORY]
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        captionStyle:
          type: string
          enum: [bold, minimal, breaking, meme, cinematic, story]
        captionPosition:
          type: string
          enum: [top, center, bottom]
        captionAnimation:
          type: string
          enum: [pop, slide, fade, word-by-word, highlight]
        background: { type: string, maxLength: 80 }
        duration:
          type: number
          enum: [15, 30, 45, 60]
        brandingStyle:
          type: string
          enum: [minimal, full]
        ctaText: { type: string, maxLength: 120 }
    ClipUpdate:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        captionStyle: { type: string }
        captionPosition: { type: string }
        captionAnimation: { type: string }
        background: { type: string }
        duration: { type: number, enum: [15, 30, 45, 60] }
        brandingStyle: { type: string }
        ctaText: { type: string, maxLength: 120 }
    ClipSettings:
      type: object
      required: [captionStyle, captionPosition, captionAnimation, background, brandingStyle, ctaText]
      properties:
        captionStyle: { type: string }
        captionPosition: { type: string }
        captionAnimation: { type: string }
        background: { type: string }
        brandingStyle: { type: string }
        ctaText: { type: string }
    ShareLink:
      type: object
      required: [url]
      properties:
        url: { type: string }
    AdminClipsOverview:
      type: object
      required: [clipCount, completedCount, failedCount, activeRenders, clips]
      properties:
        clipCount: { type: number }
        completedCount: { type: number }
        failedCount: { type: number }
        activeRenders: { type: number }
        clips:
          type: array
          items: { $ref: "#/components/schemas/Clip" }
    Targeting:
      type: object
      additionalProperties: false
      properties:
        geographies: { type: array, maxItems: 50, items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9 _-]{1,79}$' } }
        languages: { type: array, maxItems: 20, items: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' } }
        devices: { type: array, maxItems: 3, items: { type: string, enum: [mobile, tablet, desktop] } }
        interests: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 80 } }
        categories: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 80 } }
        keywords: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 80 } }
        exclusions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 80 } }
    Advertiser:
      type: object
      required: [id, name, status, ownerClerkId, contactEmail, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        ownerClerkId: { type: [string, "null"] }
        contactEmail: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    AdvertiserInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        ownerClerkId: { type: string, maxLength: 200 }
        contactEmail: { type: string, maxLength: 320 }
    Campaign:
      type: object
      required: [id, advertiserId, name, status, placements, targeting, dailyBudget, totalBudget, pricingModel, bidAmount, spentAmount, startsAt, endsAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        advertiserId: { type: string }
        name: { type: string }
        status: { type: string }
        placements: { type: array, items: { type: string } }
        targeting: { $ref: "#/components/schemas/Targeting" }
        dailyBudget: { type: [number, "null"] }
        totalBudget: { type: [number, "null"] }
        pricingModel: { type: string, enum: [cpm, cpc, cpv] }
        bidAmount: { type: [number, "null"] }
        spentAmount: { type: number }
        startsAt: { type: [string, "null"] }
        endsAt: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    CampaignInput:
      type: object
      required: [advertiserId, name, placements]
      properties:
        advertiserId: { type: string }
